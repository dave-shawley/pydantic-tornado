name: "lint, validate, and test"
on:
  push:
    branches: ["decorator"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: "Install hatch"
        run: |
          python -m pip install 'hatch>1.9,<2'
      - name: "Check code and run tests"
        run: |
          hatch run test
